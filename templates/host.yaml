# Per-host overlay. Copy to hosts/<hostname>.yaml (e.g. hosts/desktop.yaml).
#
# The active host is picked by the global `--host <name>` flag, or
# auto-detected from the machine's hostname when a matching
# hosts/<hostname>.yaml exists. With no matching host, profile.yaml
# is used as-is.

description: Gaming desktop

# Modules added on top of profile.yaml's enabled_modules
modules:
  - gaming
  - nvidia

# Modules removed from profile.yaml's enabled_modules (optional)
exclude_modules: []

# Dotfiles added on top of profile.yaml's dotfiles (optional)
# dotfiles:
#   - yazi/

# Dotfiles removed from profile.yaml's dotfiles, by source name (optional)
# exclude_dotfiles:
#   - helix

# Optional base image overrides for this host
# base_image: ghcr.io/ublue-os/bazzite-nvidia-open:stable
# nvidia_base_image: ghcr.io/ublue-os/bazzite-nvidia-open:stable

# Optional package manager override (dnf, apt, zypper, pacman)
# package_manager: apt

# Optional build storage override (optimized or system).
# Applies to Podman on the machine running this build.
# build_storage: system

# RakuOS only: override the profile's overlay_module so this machine
# reconciles its live usr-overlay against its own module. Keep overlay
# modules out of `modules:` above — they are rum-managed, not image-baked.
# overlay_module: overlay-desktop

# Optional kernel override for this device. When present it replaces the
# profile's `kernel:` block entirely (like base_image above).
# kernel:
#   repo:
#     copr: [bieszczaders/kernel-cachyos]
#   packages: [kernel-cachyos-lts]
#   version: "6.11.5"
#   versionlock: true
