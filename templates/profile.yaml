name: my-image
base_image: ghcr.io/ublue-os/bazzite:stable
nvidia_base_image: ghcr.io/ublue-os/bazzite-nvidia-open:stable
default_tag: latest
package_manager: dnf

enabled_modules:
  - base

# RakuOS only: module that holds the live `rum` usr-overlay manifest. Do NOT
# add it to enabled_modules — its packages are installed/removed in the
# overlay with rum (not baked into the image). `dcli-bootc overlay import`
# snapshots the overlay into it; build/update and `overlay sync` reconcile the
# overlay to match it.
# overlay_module: overlay

# Dotfiles from dotfiles/, symlinked into your home on build/update (or with
# `dcli-bootc dotfiles`). Plain entries target ~/.config/<name>; use a
# single-key map for files that live elsewhere:
# dotfiles:
#   - fish/
#   - helix/
#   - bashrc: ~/.bashrc

# Kernel management (dnf only). Swaps the stock kernel for an alternative
# (e.g. CachyOS), optionally pins the version, and regenerates the initramfs.
# bootc supports exactly one kernel per image, so the stock kernel is removed
# automatically unless you set `remove: []`. Override per host in hosts/.
# kernel:
#   repo:
#     copr: [bieszczaders/kernel-cachyos]
#   remove:                 # optional; defaults to the Fedora stock kernel set
#     - kernel
#     - kernel-core
#     - kernel-modules
#     - kernel-modules-core
#     - kernel-modules-extra
#   packages:
#     - kernel-cachyos
#   version: "6.11.5"       # optional; pins the install spec
#   versionlock: true       # optional; dnf versionlock the installed kernel
#   regen_initramfs: true   # default; required for the kernel to boot
